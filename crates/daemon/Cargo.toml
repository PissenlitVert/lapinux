[package]
name = "ludus-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
ludus-core = { path = "../core" }
ludus-steam = { path = "../steam" }
ludus-proton = { path = "../proton" }
ludus-perf = { path = "../perf" }
ludus-input = { path = "../input" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
