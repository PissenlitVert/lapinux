[library.hint]
playtime = "Trié par temps de jeu, du plus joué au moins joué.\n· Steam : les heures du compte, pour les jeux déjà lancés ;\n· Epic : le service de temps de jeu du compte, qui compte aussi le launcher et les menus des jeux à service — Fortnite ou Genshin affichent donc des totaux gonflés ;\n· GOG et itch n'en publient aucun : seuls les jeux lancés depuis Lapinux y ont une durée.\nLes jeux jamais lancés passent en fin de liste."
acquired = "Trié par date d'obtention, la plus récente d'abord.\nLa date vient de la boutique, et toutes ne la donnent pas :\n· Steam date l'ajout de chaque licence au compte et reprend, pour les jeux prêtés par la famille, la date d'obtention publiée par son service ;\n· Epic et itch datent chaque jeu ;\n· GOG n'en publie aucune.\nLes jeux sans date passent en fin de liste, classés alphabétiquement."
publisher = "Éditeurs lus dans les fiches des boutiques.\n· Steam : la fiche PICS de chaque jeu possédé ;\n· Epic : la fiche du catalogue, qui nomme souvent l'éditeur sans le studio ;\n· GOG : le catalogue Galaxy ;\n· itch : l'auteur du jeu.\nLes formes juridiques (Ltd., Inc., of Europe…) sont retirées pour regrouper les variantes, et un jeu que personne ne nomme apparaît sous « Inconnu »."
developer = "Développeurs lus dans les mêmes fiches.\nCertaines boutiques ne nomment qu'un seul nom : Epic recopie parfois l'éditeur chez le développeur, et itch donne l'auteur pour les deux.\nOuvrir la fiche d'un jeu apprend le vrai studio là où la boutique ne le publiait que dans sa vitrine : il rejoint alors la liste.\nUn jeu sans crédit apparaît sous « Inconnu »."

