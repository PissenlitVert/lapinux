[library.hint]
playtime = "Sorted by playtime, most played first.\n· Steam: the account's hours, for games already launched;\n· Epic: the account's playtime service, which also counts the launcher and live-game menus — Fortnite or Genshin therefore report inflated totals;\n· GOG and itch publish none: only games launched from Lapinux have a duration.\nNever-launched games go to the end of the list."
acquired = "Sorted by acquisition date, newest first.\nThe date comes from the store, and not every store gives it:\n· Steam dates each licence added to the account, and for family-shared games uses the acquisition date published by its family service;\n· Epic and itch date every game;\n· GOG publishes none.\nGames without a date go to the end of the list, sorted alphabetically."
publisher = "Publishers read from store pages.\n· Steam: each owned game's PICS page;\n· Epic: the catalog page, which often names the publisher without the studio;\n· GOG: the Galaxy catalog;\n· itch: the game's author.\nLegal forms (Ltd., Inc., of Europe…) are stripped so variants group together, and a game nobody names appears under “Unknown”."
developer = "Developers read from the same pages.\nSome stores name only one party: Epic sometimes copies the publisher into the developer field, and itch gives the author for both.\nOpening a game's page learns the real studio where the store only published it in its showcase: it then joins the list.\nA game without credits appears under “Unknown”."

