[package]
name = "lapinux-stores"
version = "0.1.0"
edition = "2021"

[dependencies]
lapinux-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
thiserror = "1"
tracing = "0.1"
libc = "0.2"
tempfile = "3"
zip = { version = "8", default-features = false, features = ["deflate"] }
# Sauvegardes cloud GOG : les métadonnées de build sont en zlib et l'envoi
# exige un corps gzippé avec son empreinte MD5.
flate2 = "1"

