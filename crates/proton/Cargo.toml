[package]
name = "ludus-proton"
version = "0.1.0"
edition = "2021"

[dependencies]
ludus-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
xz2 = "0.1"
ruzstd = "0.7"
tracing = "0.1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
