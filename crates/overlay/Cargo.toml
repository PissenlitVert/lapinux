[package]
name = "lapinux-overlay"
version = "0.1.0"
edition = "2021"

[dependencies]
lapinux-core = { path = "../core" }
lapinux-perf = { path = "../perf" }
lapinux-input = { path = "../input" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wayland-client = "0.31"
wayland-cursor = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
tiny-skia = "0.11"
# Jaquette du jeu en tête du panneau : le cache de Lapinux la garde en JPEG.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ab_glyph = "0.2"
tracing = "0.1"
thiserror = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
toml = "0.8"
