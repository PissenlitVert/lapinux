[package]
name = "ludus-overlay"
version = "0.1.0"
edition = "2021"

[dependencies]
ludus-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
tiny-skia = "0.11"
ab_glyph = "0.2"
tracing = "0.1"
thiserror = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
