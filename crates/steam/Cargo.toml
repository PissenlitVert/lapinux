[package]
name = "ludus-steam"
version = "0.1.0"
edition = "2021"

[dependencies]
ludus-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
ureq = "2"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
tracing = "0.1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
