# Steam Controller 2026 (Triton) : hid-steam garde sinon le mode clavier/souris
# (« lizard mode »). Dans ce mode, la manette envoie ses appuis comme un clavier
# sur le Puck et le pad natif reste muet : ni boutons, ni gyroscope.
# Lapinux l'utilise comme manette ; on désactive ce mode au chargement du pilote.
# Installation : cp packaging/99-steam-controller.conf /etc/modprobe.d/
# Puis recharger hid_steam ou redémarrer.
options hid_steam lizard_mode=0
